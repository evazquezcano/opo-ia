name: Publicar OPO-IA y NORMA-IA en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/index.html'
      - 'web/norma-ia/**'
      - '.github/workflows/publicar-herramientas.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperar código
        uses: actions/checkout@v4
      - name: Comprobar NORMA-IA
        run: node web/norma-ia/test-check.cjs
      - name: Preparar publicación sin alterar OPO-IA
        run: |
          mkdir -p _site/web/norma-ia
          cp web/index.html _site/index.html
          cp web/index.html _site/web/index.html
          cp web/norma-ia/index.html _site/web/norma-ia/index.html
          touch _site/.nojekyll
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
