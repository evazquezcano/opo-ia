name: OPO-IA · Descarga documental inicial
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  descarga:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recuperar documentos e inventariar resultados
        run: python scripts/ingesta_inicial.py
      - name: Guardar documentos e informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opo-ia-fuentes-provisionales
          path: resultados_ingesta/
          if-no-files-found: warn
          retention-days: 30
